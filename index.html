


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator – Thome Fintech</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="siteheader">
    <div class="headercontent">

        <div class="brand">
          
           <span class="brandname">Emi Calculator Web Application</span>
        </div>

       

    </div>
</header>
<main class="container">
    <h1>EMI Calculator</h1>

    <label for="price">Product Price (₹)</label>
    <input type="number" id="price" placeholder="e.g. 50000">

    <label for="downPayment">Down Payment (₹)</label>
    <input type="number" id="downPayment" placeholder="e.g. 5000">

    <label for="rate">Annual Interest Rate (%)</label>
    <input type="number" id="rate" placeholder="e.g. 12">

    <label for="tenure">Tenure (Months)</label>
    <input type="number" id="tenure" placeholder="e.g. 12">
<div class="button-group">
    <button class="btn-calc" onclick="calculateEMI()">Calculate EMI</button>
    <button class="btn-reset" onclick="resetForm()">Clear Values</button>
</div>

   

    <div class="result" id="result"></div>
</main>
<footer class="sitefooter">
    <p>© 2026 Emi-Calculator. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
